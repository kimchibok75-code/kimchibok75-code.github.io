<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>김치복 | 림월드 유튜버</title>
  <meta name="description" content="림월드 유튜버 김치복 공식 홈페이지 — 최신 영상, 생방송 알림, 방송 일정, 모드 추천, 창작마당 주간 순위">
  <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
  <meta property="og:title" content="김치복 | 림월드 유튜버">
  <meta property="og:description" content="최신 영상 · 생방송 알림 · 방송 일정 · 모드 추천 · 주간 모드 순위">
  <meta property="og:image" content="assets/img/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon-192.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="김치복">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=__BUILD__">
</head>
<body data-page="home">
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="grain"></i></div>

  <header class="nav glass">
    <a class="brand" href="./"><img src="assets/img/profile.jpg" alt="" width="32" height="32"><span>김치복</span></a>
    <nav class="nav-links" aria-label="메뉴">
      <a href="./#videos">영상</a><a href="schedule.html">방송 일정</a><a href="mods.html">모드 추천</a><a href="weekly.html">주간 모드 순위</a><a href="community.html">커뮤니티</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" aria-label="테마 전환"></button>
      <button class="btn btn-accent btn-sm" id="notifyBtn" aria-label="알림 설정"><svg><use href="#i-bell"/></svg><span>알림 받기</span></button>
    </div>
  </header>

  <main id="top">
    <!-- 히어로 -->
    <section class="hero">
      <h1 class="sr-only">김치복 — 림월드 크리에이터</h1>
      <!-- 바로가기: 윗줄 채널 4개, 아랫줄 카페·디스코드·모드 추천·주간 모드 순위 -->
      <div class="channels" id="channels"></div>

      <!-- 생방송 상황판 + 7일 방송 일정 -->
      <div class="board glass" id="board">
        <div class="lb-top">
          <a class="lb-main" id="liveCard" href="https://chzzk.naver.com/live/d44a982c742226605f4fcf3b6b4e7629" target="_blank" rel="noopener">
            <div class="lb-media" id="liveMedia"></div>
            <div class="lb-body">
              <span class="live-state" id="liveState">방송 상태 확인 중…</span>
              <strong id="liveTitle">치지직</strong>
              <small id="liveSub"></small>
            </div>
          </a>
          <div class="lb-count" id="liveFoot"></div>
        </div>
        <div class="week-head"><strong>이번 주 방송</strong><a href="schedule.html">달력 보기 →</a></div>
        <ol class="week-strip" id="weekList"></ol>
      </div>
    </section>

    <!-- 영상 -->
    <section id="videos" class="section">
      <div class="section-head">
        <div><h2>영상</h2><p class="muted">김치복 · 풀치복 · 음치복, 세 채널의 새 영상과 인기 영상을 한곳에서</p></div>
      </div>
      <div class="seg seg-ch" id="chTabs" role="tablist"></div>
      <div class="seg seg-sub" id="vidTabs" role="tablist">
        <button data-v="videos" class="on">최신 영상</button>
        <button data-v="popular">인기 순위</button>
        <button data-v="shorts">쇼츠</button>
        <button data-v="lives">라이브</button>
      </div>
      <div id="videoArea"></div>
    </section>
  </main>

  <!-- 영상 플레이어 -->
  <dialog class="modal" id="player">
    <div class="modal-box glass">
      <button class="icon-btn modal-x" data-close aria-label="닫기"><svg><use href="#i-x"/></svg></button>
      <div class="player-frame" id="playerFrame"></div>
      <div class="player-meta"><strong id="playerTitle"></strong><a id="playerLink" target="_blank" rel="noopener">유튜브에서 보기 <svg><use href="#i-arrow"/></svg></a></div>
    </div>
  </dialog>

  <script src="assets/js/app.js?v=__BUILD__" type="module"></script>
</body>
</html>
