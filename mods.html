<body data-page="mods">

    <div class="nav-actions">

    </div>

  <main>
    <section class="section page-top">
      <div class="section-head">
        <div>
          <a class="back" href="./">← 홈</a>
          <h1 class="page-title">모드 추천</h1>
          <p class="muted" id="modCount">김치복이 직접 쓰고 추천하는 림월드 모드</p>
        </div>
        <a class="btn btn-ghost btn-sm" id="sheetLink" target="_blank" rel="noopener"><svg><use href="#i-sheet"/></svg>원본 시트</a>

      <div class="mod-notes" id="modNotes"></div>

      <details class="guide glass" id="guide" hidden><summary>김치복의 모드 사용 안내 &amp; 자주 묻는 질문</summary><div id="guideBody"></div></details>
