<body data-page="schedule">
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="grain"></i></div>

  <header class="nav glass">
    <a class="brand" href="./"><img src="assets/img/profile.jpg" alt="" width="32" height="32"><span>김치복</span></a>
    <nav class="nav-links" aria-label="메뉴">

    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" aria-label="테마 전환"></button>
      <button class="btn btn-accent btn-sm" id="notifyBtn" aria-label="알림 설정"><svg><use href="#i-bell"/></svg><span>알림 받기</span></button>
    </div>
  </header>

  <main>
    <section class="section page-top">
      <div class="section-head">
        <div>
          <a class="back" href="./">← 홈</a>
          <h1 class="page-title">방송 일정</h1>
          <p class="muted" id="schedHint">매주 금 · 토 · 일 밤 9시 치지직</p>
        </div>
        <div class="next-live glass-soft" id="nextLive"></div>
      </div>
      <div class="cal-wrap">
        <div class="calendar glass">
          <div class="cal-head">
            <button class="icon-btn" id="calPrev" aria-label="이전 달"><svg><use href="#i-left"/></svg></button>
            <strong id="calTitle"></strong>
            <button class="icon-btn" id="calNext" aria-label="다음 달"><svg><use href="#i-right"/></svg></button>

          <div class="cal-grid cal-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>

          <div class="cal-legend"><span><i class="dot d-plan"></i>예정 방송</span><span><i class="dot d-live"></i>진행한 방송</span><span><i class="dot d-yt"></i>영상 업로드</span><span><i class="dot d-event"></i>특별 일정</span></div>
        </div>
        <aside class="cal-detail glass" id="calDetail"></aside>
      </div>
