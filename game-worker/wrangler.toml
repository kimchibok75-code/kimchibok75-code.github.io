# 치복 타운 게임 서버
# 배포: 이 폴더에서  npx --yes wrangler@4 deploy
# 표 바꾸기(새 migrations 파일 추가 후):  npx --yes wrangler@4 d1 migrations apply kimchibok-game --remote
name = "kimchibok-game"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "kimchibok-game"
database_id = "40dd7d72-2e27-4412-91d1-1ba075296663"
migrations_dir = "migrations"

[observability]
enabled = true

# 실시간 마을 방 (3단계). 무료 요금제는 SQLite 방식 Durable Object만 됨
[[durable_objects.bindings]]
name = "TOWN"
class_name = "Town"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Town"]

# 치지직 채팅 받아 오기 (방송 중에만 접속, 하나만 씀)
[[durable_objects.bindings]]
name = "CHZZK"
class_name = "Chzzk"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Chzzk"]

# 레이드 (매시 정각, 하나만 씀)
[[durable_objects.bindings]]
name = "RAID"
class_name = "Raid"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Raid"]

# 빙고 (관리자가 열 때만, 하나만 씀) — 2026-11-21 (처음엔 OX 퀴즈였음, 클래스 이름 Quiz 그대로)
[[durable_objects.bindings]]
name = "QUIZ"
class_name = "Quiz"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Quiz"]

[vars]
CHZZK_CHANNEL = "d44a982c742226605f4fcf3b6b4e7629"   # 김치복 치지직 채널 (config/site.json과 같음)

[triggers]
crons = ["*/5 * * * *"]

# 방송 상태 (kimchibok-live Worker에 바로 연결, 요청 수 아낌)
[[services]]
binding = "LIVE"
service = "kimchibok-live"
